<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>gings_on — 분실물 찾기</title>
<style>
:root{--green:#235c49;--light:#eaf3ee;--ink:#1c2b25;--muted:#6c7b73;--bg:#f6f8f5;--white:#fff;--line:#e1e9e3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:white;padding:34px 20px 28px}header .wrap,main{max-width:1000px;margin:auto}header small{letter-spacing:2px;font-weight:700;opacity:.8}header h1{font-size:clamp(30px,6vw,48px);margin:12px 0 8px}header p{max-width:650px;line-height:1.6;margin:0;color:#e0eee7}.tag{display:inline-block;border:1px solid #ffffff55;border-radius:50px;padding:7px 12px;font-size:12px;margin-top:16px}
main{padding:24px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h2{margin:0;font-size:22px}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 16px;font-weight:700;cursor:pointer}.btn:hover{opacity:.9}.btn.secondary{background:var(--light);color:var(--green)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters input,.filters select,form input,form select,form textarea{border:1px solid var(--line);background:white;border-radius:11px;padding:12px;font:inherit;color:var(--ink)}.filters input{flex:1;min-width:180px}.filters select{min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #183a2610}.card img{width:100%;height:190px;object-fit:cover;background:var(--light)}.cardbody{padding:15px}.card h3{margin:0 0 8px;font-size:18px}.meta{color:var(--muted);font-size:13px;line-height:1.65}.status{display:inline-block;padding:5px 9px;border-radius:30px;background:#fff1d9;color:#80551a;font-size:12px;font-weight:700;margin-top:9px}.status.returned{background:#e3f3e9;color:#246247}.card button{margin-top:12px;width:100%}.empty{text-align:center;padding:55px 15px;color:var(--muted);border:1px dashed #b7c9bd;border-radius:18px;grid-column:1/-1}.modal{position:fixed;inset:0;background:#0b2119aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.panel{background:white;border-radius:20px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}.panel h2{margin-top:0}.panel form{display:grid;gap:13px}.panel label{display:grid;gap:6px;font-size:14px;font-weight:650}.panel input,.panel select,.panel textarea{width:100%}.panel textarea{min-height:75px;resize:vertical}.preview{width:100%;max-height:250px;object-fit:contain;border-radius:12px;background:var(--light);display:none}.actions{display:flex;gap:9px}.actions button{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.5}.footer{margin-top:35px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><div class="wrap"><small>공동체 • 재사용 • SDG 12</small><h1>gings_on <span style="font-size:.55em">↺</span></h1><p>물건을 잃어버렸나요? 발견했나요? 물건을 주인에게 돌려주고 재사용을 실천해요.</p><span class="tag">SDG 12 — 지속가능한 소비와 생산</span></div></header>
<main><div class="top"><h2>우리 학교 분실물 게시판</h2><button class="btn" id="openForm">＋ 분실물 등록</button></div>
<div class="filters"><input id="search" placeholder="물건 이름 또는 위치 검색…"><select id="category"><option value="">모든 분류</option><option>전자기기</option><option>문구류</option><option>가방·지갑</option><option>의류</option><option>액세서리</option><option>기타</option></select><select id="place"><option value="">모든 장소</option><option>교실</option><option>도서관</option><option>식당</option><option>체육관</option><option>학교 내 기타 장소</option><option>기타</option></select><select id="statusFilter"><option value="">모든 상태</option><option value="active">주인 찾는 중</option><option value="returned">반환 완료</option></select></div>
<div class="grid" id="items"></div><div class="footer">물건에 두 번째 기회를 주세요. 새로 사기보다 다시 사용해요.<br>게시글은 현재 기기의 브라우저에 저장되는 시제품입니다.</div></main>
<div class="modal" id="modal"><div class="panel"><h2>분실물 등록하기</h2><form id="postForm"><label>사진 (카메라 또는 갤러리)<input type="file" id="photo" accept="image/*" capture="environment" required></label><img class="preview" id="preview" alt="Photo preview"><label>물건 이름<input id="name" placeholder="예: 파란색 필통" required maxlength="60"></label><label>분류<select id="cat" required><option value="">분류 선택</option><option>전자기기</option><option>문구류</option><option>가방·지갑</option><option>의류</option><option>액세서리</option><option>기타</option></select></label><label>발견 장소<select id="pl" required><option value="">장소 선택</option><option>교실</option><option>도서관</option><option>식당</option><option>체육관</option><option>학교 내 기타 장소</option><option>기타</option></select></label><label>세부 위치<input id="location" placeholder="예: 2층 203호 옆" maxlength="120" required></label><label>발견 날짜<input type="date" id="date" required></label><label>추가 설명<textarea id="details" placeholder="색상이나 특징 등을 적어주세요. (개인정보는 올리지 마세요.)"></textarea></label><div class="actions"><button class="btn" type="submit">등록하기</button><button class="btn secondary" type="button" id="cancel">취소</button></div><p class="note">개인정보 보호를 위해 전화번호, 주소, 학생증 등 개인정보가 사진이나 설명에 노출되지 않도록 주의하세요.</p></form></div></div>
<script>
const DB='gings_on_posts_v1';let posts=[];let photoData='';
const $=id=>document.getElementById(id);
function load(){try{posts=JSON.parse(localStorage.getItem(DB)||'[]')}catch(e){posts=[]}render()}
function save(){try{localStorage.setItem(DB,JSON.stringify(posts))}catch(e){alert('저장 공간이 부족합니다. 더 작은 사진을 선택해 주세요.')}render()}
function render(){const q=$('search').value.toLowerCase(),c=$('category').value,p=$('place').value,s=$('statusFilter').value;let filtered=posts.filter(x=>(x.name.toLowerCase().includes(q)||x.location.toLowerCase().includes(q)||x.details.toLowerCase().includes(q))&&(!c||x.category===c)&&(!p||x.place===p)&&(!s||(s==='returned'?x.returned:!x.returned)));$('items').innerHTML='';if(!filtered.length){$('items').innerHTML='<div class="empty">등록된 물건이 없습니다.<br>다른 검색어를 입력하거나 분실물을 등록해 보세요.</div>';return}filtered.slice().reverse().forEach(x=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<img src="${x.photo}" alt="Found item"><div class="cardbody"><h3></h3><div class="meta"></div><span class="status ${x.returned?'returned':''}">${x.returned?'✓ 반환 완료':'● 주인 찾는 중'}</span><button class="btn ${x.returned?'secondary':''}" data-id="${x.id}">${x.returned?'찾는 중으로 변경':'반환 완료로 표시'}</button></div>`;card.querySelector('h3').textContent=x.name;card.querySelector('.meta').textContent=`${x.category} · ${x.place} · ${x.location} · ${x.date}${x.details?'\n'+x.details:''}`;card.querySelector('button').onclick=()=>{const item=posts.find(z=>z.id===x.id);item.returned=!item.returned;save()};$('items').append(card)})}
$('openForm').onclick=()=>{$('modal').classList.add('open');$('date').value=new Date().toISOString().slice(0,10)};$('cancel').onclick=()=>close();function close(){$('modal').classList.remove('open');$('postForm').reset();$('preview').style.display='none';photoData=''}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});
$('photo').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024){alert('5MB 이하의 사진을 선택해 주세요.');e.target.value='';return}const reader=new FileReader();reader.onload=ev=>{photoData=ev.target.result;$('preview').src=photoData;$('preview').style.display='block'};reader.readAsDataURL(file)};
$('postForm').onsubmit=e=>{e.preventDefault();if(!photoData)return;posts.push({id:Date.now(),photo:photoData,name:$('name').value.trim(),category:$('cat').value,place:$('pl').value,location:$('location').value.trim(),date:$('date').value,details:$('details').value.trim(),returned:false});save();close()};['search','category','place','statusFilter'].forEach(id=>$(id).addEventListener('input',render));load();
</script></body></html>
